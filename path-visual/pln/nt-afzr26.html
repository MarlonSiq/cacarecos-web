<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/redirect-style.css">  
  <link rel="stylesheet" href="../css/responsive.css">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
   <script src="../js/button-share.js" defer></script>
    <script src="../js/theme.js" defer></script>
    <script src="../js/layout-red.js" defer></script>
  <script src="../js/redirect.js" defer></script>
  <script src="../components/footer-without-theme.js" defer></script>
  
</head>

<body data-redirect="https://www.youtube.com">

  <div class="card">

    <header>
      <nav class="nav">
        <a href="../index.html" target="_blank" rel="noopener noreferrer">Path</a>

        <button class="link-button" id="shareBtn">
          <span class="material-symbols-outlined icon-light">share</span>
        </button>
      </nav>
    </header>

    <div class="wrapper">
      <div class="folder">
        <span class="folder-top"></span>
        <span class="paper"></span>
        <span class="folder-bg">
          <img src="../images/folder.svg" class="photo-profil" alt="">
        </span>
      </div>
    </div>

    <p id="message"></p>

    <div class="loader-wrapper">
      <div class="loader-line"></div>
    </div>

    <div id="destination"></div>

    <div class="actions">
      <button id="cancelBtn">Cancelar</button>
      <button id="goBtn">Avançar</button>
    </div>
    
    <div id="footer"></div>


  </div>

</body>

</html>
