    <!-- SEO básico -->
    <title>YourWebsite</title>

    <!-- Evita que a página seja indexada enquanto está em construção -->

    <link rel="canonical" href="https://www.yourwebsite.com/pagina-principal">

    <link rel="alternate" hreflang="pt-BR" href="https://www.yourwebsite.com/">

    <link rel="alternate" hreflang="x-default" href="https://seudominio.com/" />
