
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO básico -->
    <title>YourWebsite</title>
    <meta name="description" content="Descrição breve e clara do que o site faz.">
    <meta name="keywords" content="palavras, chave, relacionadas">
    <meta name="author" content="Seu Nome ou Empresa">
    
    <!-- Evita que a página seja indexada enquanto está em construção -->
    <meta name="robots" content="noindex, nofollow">    
    
    <!-- Define versão canônica da página (evita conteúdo duplicado) -->
    <link rel="canonical" href="https://www.yourwebsite.com/pagina-principal">
    
    <!-- Performance (pré-carregamento de fontes e CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" href="estilo.css" as="style">
  
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Mulish:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
    
    <link rel="icon" href="imagens/favicon.png" type="image/png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon.png">        
    <link rel="icon" type="image/png" sizes="192x192" href="imagens/favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="imagens/favicon-512x512.png">
    <link rel="apple-touch-icon" href="imagens/apple-touch-icon.png" sizes="180x180">
</head>

<body>

    <header>
    <nav>
        <a href="#" class="menu-flutuante-back" onclick="voltar()">Voltar</a>
      <a href="#">Início</a>
      <a href="#">Sobre</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <!-- Conteúdo principal -->
  <main id="main">
    <section id="intro">
      <h1>Bem-vindo ao YourWebsite</h1>
      <p>Um texto de apresentação do seu site.</p>
    </section>

    <section id="servicos">
      <h2>Nossos Serviços</h2>
      <p>Descreva o que você oferece aqui.</p>
    </section>
  </main>

  <script src="texto-footer.js" defer></script>
     
<footer>
    <p>YourWebsite © <span id="current-year"></span></p>
</footer>

    <script>
        document.querySelector('#current-year').textContent = new Date().getFullYear();
    </script>
    
    <script>
function voltar() {
  document.body.classList.add('fade-out');
  
  setTimeout(() => {
    if (document.referrer && document.referrer !== window.location.href) {
      history.back();
    } else {
      window.location.href = '/index.html'; // muda pra tua home
    }
  }, 400); // tempo da transição
}
</script>
</body>
</html>
